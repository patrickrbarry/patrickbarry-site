name: Update Greenhouse Company Map

on:
  schedule:
    - cron: '0 8 3 * *'   # 3rd of each month at 8am UTC — matches the Greenhouse partner-update cadence
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Greenhouse companies
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 scripts/fetch_greenhouse.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/greenhouse.json
          git diff --staged --quiet || git commit -m "chore: update Greenhouse company map"
          git push
